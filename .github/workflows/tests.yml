name: Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Museum/Museum.slnx

      - name: Build
        run: dotnet build Museum/Museum.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Museum/Museum.slnx --configuration Release --no-build